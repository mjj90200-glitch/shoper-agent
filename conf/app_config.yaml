logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3307}
  user: ${oc.env:MYSQL_USER}
  password: ${oc.env:MYSQL_PASSWORD}
  database: meta

db_dw:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3307}
  user: ${oc.env:MYSQL_USER}
  password: ${oc.env:MYSQL_PASSWORD}
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8086
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: data_agent

llm:
  model_name: deepseek-v4-flash
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.deepseek.com

tts:
  api_key: ${oc.env:VOLCENGINE_TTS_API_KEY,null}
  voice_type: ${oc.env:VOLCENGINE_TTS_VOICE_TYPE,zh_female_vv_uranus_bigtts}
  base_url: ${oc.env:VOLCENGINE_TTS_BASE_URL,https://openspeech.bytedance.com/api/v3/tts/unidirectional/sse}
  resource_id: ${oc.env:VOLCENGINE_TTS_RESOURCE_ID,seed-tts-2.0}
  timeout_seconds: 60
  max_chars: 600
